<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文件 · DSH Files</title><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="workspace">
    <aside class="places" id="places">
      <div class="sidebar-title"><span data-i18n="title">文件</span><button id="sidebar-close" class="icon-button mobile-only" data-label="toggleSidebar" data-icon="sidebar"></button></div>
      <div class="places-heading"><p class="section-label" data-i18n="places">收藏位置</p><button id="add-place" class="icon-button" data-label="addPlace" data-icon="plus" disabled></button></div>
      <p id="places-empty" class="places-empty" data-i18n="placesEmpty" hidden>还没有收藏位置，点击 + 添加。</p><nav id="roots" data-label="places"></nav>
      <div class="places-actions"><button id="add-current-place" class="place-add" disabled><span data-icon="plus"></span><span data-i18n="favoriteCurrent">收藏当前文件夹</span></button></div>
      <div class="places-foot"><span id="mode"></span><span id="version"></span></div>
    </aside>
    <main class="main">
      <header class="toolbar">
        <button id="toggle-sidebar" class="icon-button" data-label="toggleSidebar" data-icon="sidebar" aria-controls="places" aria-expanded="true"></button>
        <div class="nav-buttons"><button id="back" class="icon-button" data-label="back" data-icon="back"></button><button id="forward" class="icon-button" data-label="forward" data-icon="forward"></button></div>
        <div class="folder-heading"><h1 id="heading" data-i18n="title">文件</h1><span id="heading-count"></span></div>
        <div class="toolbar-spacer"></div>
        <div class="view-switch segmented" role="group" data-label="viewMode"><button id="grid-view" class="icon-button" data-label="gridView" data-icon="grid" aria-pressed="true"></button><button id="list-view" class="icon-button" data-label="listView" data-icon="list" aria-pressed="false"></button></div>
        <details id="view-options" class="dropdown"><summary class="icon-button" data-label="viewOptions" data-icon="sort"></summary><div class="menu view-menu">
          <label for="sort-by" data-i18n="sortBy">排序方式</label><select id="sort-by"><option value="name" data-i18n="name">名称</option><option value="mtime" data-i18n="modified">修改时间</option><option value="size" data-i18n="size">大小</option><option value="kind" data-i18n="type">类型</option></select>
          <label for="sort-direction" data-i18n="sortDirection">排列顺序</label><select id="sort-direction"><option value="asc" data-i18n="ascending">升序</option><option value="desc" data-i18n="descending">降序</option></select>
          <div class="menu-separator"></div><label class="check-label"><input id="hidden-files" type="checkbox"><span data-i18n="hidden">隐藏文件</span></label>
          <label for="theme" data-i18n="appearance">外观</label><select id="theme"><option value="system" data-i18n="systemTheme">跟随系统</option><option value="light" data-i18n="lightTheme">浅色</option><option value="dark" data-i18n="darkTheme">深色</option></select>
        </div></details>
        <span class="toolbar-divider"></span>
        <button id="new-folder" class="icon-button" data-label="newFolder" data-icon="newFolder"></button>
        <button id="upload" class="icon-button" data-label="upload" data-icon="upload"></button><input id="upload-input" type="file" multiple hidden>
        <details id="more" class="dropdown"><summary class="icon-button" data-label="more" data-icon="more"></summary><div class="menu action-menu">
          <button id="new-file" data-i18n="newFile">新建文本文件</button><div class="menu-separator"></div>
          <button id="copy" data-i18n="copy">复制</button><button id="cut" data-i18n="cut">剪切</button><button id="paste" data-i18n="paste">粘贴</button><button id="rename" data-i18n="rename">重命名</button><button id="duplicate" data-i18n="duplicate">制作副本</button>
          <div class="menu-separator"></div><button id="zip" data-i18n="zip">压缩为 ZIP</button><button id="extract" data-i18n="extract">解压到文件夹</button>
          <button id="favorite" data-i18n="favoriteFolder">添加到侧栏</button><button id="copy-path" data-i18n="copyPath">复制路径</button><button id="open" data-i18n="open">用系统应用打开</button><button id="editor-open" data-i18n="editorOpen">用编辑器打开</button><button id="reveal" data-i18n="reveal">在系统文件管理器中显示</button>
          <div class="menu-separator"></div><button id="disk-usage" data-i18n="diskUsage">磁盘占用透视</button><button id="open-trash" data-i18n="openTrash">打开废纸篓</button>
          <div class="menu-separator"></div><button id="trash" class="danger" data-i18n="trash">移到废纸篓</button>
        </div></details>
        <button id="toggle-preview" class="icon-button" data-label="togglePreview" data-icon="preview" aria-pressed="false"></button>
        <form id="search-form" class="search-form"><span data-icon="search"></span><input id="search" type="search" data-label="search" autocomplete="off"><button id="clear-search" type="button" class="icon-button" data-label="clear" data-icon="close" hidden></button></form>
      </header>
      <div class="location-bar">
        <button id="up" class="icon-button" data-label="up" data-icon="up"></button><nav id="breadcrumb" data-label="breadcrumb"></nav>
        <form id="path-form" class="path-form" hidden><input id="path" data-label="path" autocomplete="off" spellcheck="false"><button class="icon-button" type="submit" data-label="go" data-icon="go"></button></form>
        <button id="edit-path" class="path-toggle" data-i18n="goToFolder">前往文件夹…</button><button id="refresh" class="icon-button" data-label="refresh" data-icon="refresh"></button>
      </div>
      <div id="search-options" class="search-options" hidden><span data-i18n="searchScope">搜索当前文件夹及子文件夹</span><label class="check-label"><input id="content-search" type="checkbox"><span data-i18n="content">搜索文件内容</span></label></div>
      <div id="notice" class="notice" role="status" hidden><span id="notice-text"></span><button id="notice-close" class="icon-button" data-label="dismiss" data-icon="close"></button></div>
      <div id="transfer" class="transfer" hidden><span id="transfer-text"></span><progress id="transfer-progress" max="100" value="0" data-label="uploading"></progress><button id="transfer-cancel" class="button small" data-i18n="cancel">取消</button></div>
      <div class="file-area">
        <section class="listing" data-label="title">
          <div id="list-head" class="list-head" hidden><button data-sort="name" data-i18n="name">名称</button><button data-sort="mtime" data-i18n="modified">修改时间</button><button data-sort="size" data-i18n="size">大小</button><button data-sort="kind" data-i18n="type">类型</button></div>
          <div id="list-scroll" class="list-scroll"><div id="rows" class="entries grid" role="listbox" data-label="title" aria-multiselectable="true" tabindex="0"></div><div id="empty" class="empty" role="status"></div><button id="load-more" class="button load-more" data-i18n="loadMore" hidden>加载更多</button></div>
        </section>
        <aside id="preview" class="preview" hidden><header><strong data-i18n="preview">预览</strong><button id="close-preview" class="icon-button" data-label="close" data-icon="close"></button></header><div id="preview-content" class="preview-content"></div></aside>
      </div>
      <footer class="status-bar"><span id="list-count"></span><span id="selection-count"></span><span id="clipboard-status"></span><span class="status-spacer"></span><span id="connection" class="connection"></span><div class="size-control" role="group" data-label="itemSize"><span data-i18n="itemSize">显示大小</span><div class="segmented"><button data-size="small" data-i18n="small" aria-pressed="false">小</button><button data-size="medium" data-i18n="medium" aria-pressed="true">中</button><button data-size="large" data-i18n="large" aria-pressed="false">大</button></div></div></footer>
    </main>
  </div>
  <div id="context-menu" class="menu context-menu" role="menu" hidden></div>
  <div id="place-menu" class="menu context-menu" role="menu" hidden></div>
  <dialog id="place-dialog" aria-labelledby="place-dialog-title"><form id="place-form">
    <h2 id="place-dialog-title"></h2><p data-i18n="placeHint">只调整侧栏快捷入口，不会移动或重命名文件夹。</p>
    <label for="place-path" data-i18n="placePath">文件夹路径</label><input id="place-path" required maxlength="4096" autocomplete="off" spellcheck="false">
    <label for="place-name" data-i18n="placeName">显示名称</label><input id="place-name" maxlength="80" autocomplete="off" data-placeholder="placeNameHint">
    <p id="place-error" role="alert" hidden></p>
    <footer><button id="place-cancel" class="button" type="button" data-i18n="cancel">取消</button><button id="place-save" class="button primary" type="submit" data-i18n="save">保存</button></footer>
  </form></dialog>
  <dialog id="dialog" aria-labelledby="dialog-title"><form id="dialog-form"><h2 id="dialog-title"></h2><p id="dialog-copy"></p><label id="dialog-label" for="dialog-input"></label><input id="dialog-input" autocomplete="off" maxlength="4096"><footer><button type="button" id="dialog-cancel" class="button" data-i18n="cancel">取消</button><button id="dialog-submit" class="button primary" type="submit"></button></footer></form></dialog>
  <dialog id="disk-dialog" aria-labelledby="disk-title">
    <h2 id="disk-title"></h2><p id="disk-path" class="disk-path"></p><p id="disk-summary" class="muted"></p>
    <div id="disk-list" class="disk-list"></div>
    <footer class="disk-footer"><button id="disk-up" class="button small" type="button" data-i18n="up">上一级</button><button id="disk-open" class="button small" type="button" data-i18n="diskOpenDir">打开此目录</button><span class="disk-spacer"></span><button id="disk-close" class="button" type="button" data-i18n="diskClose">关闭</button></footer>
  </dialog>
  <script type="module" src="./app.js"></script>
</body></html>
